<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gaavn Fresh — Sheet ➜ Firestore migration v3</title>
<style>
:root{--ink:#1A1208;--cream:#FBF6EC;--surface:#fff;--border:#E8DFC9;--green:#2E7D32;--red:#C62828;--amber:#C8830A;--blue:#1A527A;--muted:#8A8070;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--cream);font-family:'Segoe UI',system-ui,sans-serif;color:var(--ink);padding:0 0 60px;}
header{background:var(--ink);color:#fff;padding:16px 22px;}
header h1{font-size:17px;}
header .sub{font-family:monospace;font-size:11px;color:#C8B89A;margin-top:3px;}
main{max-width:1100px;margin:0 auto;padding:18px 22px;}
.panel{background:var(--surface);border:1.5px solid var(--border);border-radius:14px;padding:16px;margin-bottom:16px;}
h3{font-size:14px;margin-bottom:10px;}
label{display:block;font-family:monospace;font-size:10px;color:var(--muted);margin:8px 0 3px;}
input{width:100%;padding:9px;border:1.5px solid var(--border);border-radius:8px;background:var(--cream);font-family:monospace;font-size:12px;}
.row{display:flex;gap:10px;flex-wrap:wrap;}
.row>div{flex:1;min-width:170px;}
button{border:none;border-radius:9px;padding:11px 18px;font-family:monospace;font-size:12px;font-weight:700;cursor:pointer;color:#fff;margin:10px 8px 0 0;}
button:disabled{opacity:.45;cursor:not-allowed;}
.b0{background:var(--red);} .b1{background:var(--blue);} .b2{background:var(--amber);} .b3{background:var(--green);} .b4{background:var(--ink);}
pre{background:#12100C;color:#D8E8D0;padding:13px;border-radius:10px;font-size:11.5px;line-height:1.65;
    max-height:460px;overflow:auto;white-space:pre-wrap;word-break:break-word;}
.muted{color:var(--muted);font-size:12px;line-height:1.65;}
.warn{background:#FFF3CD;border:1.5px solid var(--amber);border-radius:10px;padding:12px;font-size:12.5px;line-height:1.7;margin-bottom:12px;}
.bad{background:#FDECEA;border:1.5px solid var(--red);border-radius:10px;padding:12px;font-size:12.5px;line-height:1.7;margin-bottom:12px;}
table{width:100%;border-collapse:collapse;font-family:monospace;font-size:11px;margin-top:8px;}
th{background:#1A3A1F;color:#fff;padding:6px 8px;text-align:left;}
td{padding:5px 8px;border-bottom:1px solid var(--border);}
.n{text-align:right;}
</style>
</head>
<body>
<header>
  <h1>Gaavn Fresh — Google Sheet ➜ Firestore migration</h1>
  <div class="sub">project gaavnfresh-sales · v3 · nothing is written until you press step 2</div>
</header>
<main>

<div class="warn" id="origin-warn" style="display:none;"></div>

<div class="panel">
  <h3>Source — your existing Google Sheet</h3>
  <div class="row">
    <div style="flex:3;">
      <label>SALES APP SCRIPT /exec URL</label>
      <input id="sheet-url" value="https://script.google.com/macros/s/AKfycbzbCsGNASVFCDZ8nnx42r3YgtLGTPEaEtswoYCsloVKyuKpyxzcjY4rNTAFx5tp2KASpg/exec">
    </div>
    <div>
      <label>ACCESS CODE <span style="color:#C62828;">(type each time — deliberately not stored)</span></label>
      <input id="sheet-key" value="" placeholder="type it — not saved in this file" autocomplete="off">
    </div>
  </div>
  <div class="row">
    <div><label>FROM MONTH</label><input type="month" id="m-from" value="2026-06"></div>
    <div><label>TO MONTH</label><input type="month" id="m-to" value="2026-08"></div>
  </div>
  <button class="b0" id="btn0" onclick="stepWipe()">0 · Erase everything in Firestore</button>
  <button class="b1" id="btn1" onclick="stepAnalyse()">1 · Read &amp; analyse (writes nothing)</button>
  <button class="b2" id="btn2" onclick="stepMigrate()" disabled>2 · Write to Firestore</button>
  <button class="b3" id="btn3" onclick="stepVerify()" disabled>3 · Verify against the Sheet</button>
  <button class="b4" onclick="dlReport()">⬇ Save report</button>
</div>

<div class="panel">
  <h3>Log</h3>
  <pre id="log">Ready. Press step 1 — it only reads.</pre>
</div>

<div class="panel" id="preview-panel" style="display:none;">
  <h3>What will be written</h3>
  <div id="preview"></div>
</div>

</main>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
/* ══════════════════════════════════════════════════════════════════════
   Gaavn Fresh — Sheet ➜ Firestore migration, v1

   DATA MODEL (deliberately different from the Sheet):

   customers/{customerId}
     name, category, area, phone, pricing{}, balance, balanceAsOf,
     createdAt, updatedAt
       → the customer's NAME EXISTS ONLY HERE. Nothing else copies it.
         This alone removes the rename / duplicate-name class of bug.

   orders/{orderId}
     customerId          ← the link. never the name.
     date 'YYYY-MM-DD', status, total, paidAmount, paymentMode,
     items[{product, qty, unit, rate, amount}],
     notes, createdBy, deleted:false, source:'sheet-migration', migratedAt
       → ONE document per order, not one row per product line, so an
         order cannot carry two different totals.

   payments/{paymentId}
     customerId, date, amount, mode, notes, createdBy, deleted:false

   Doc IDs are the Sheet's own Order/Payment IDs, so re-running this
   tool OVERWRITES rather than duplicates. It is safe to run twice.
   ══════════════════════════════════════════════════════════════════════ */

const firebaseConfig = {
  apiKey: "AIzaSyAI8NvjxdcmoG2UinhJ0LZ0EdL18b-foZ0",
  authDomain: "gaavnfresh-sales.firebaseapp.com",
  projectId: "gaavnfresh-sales",
  storageBucket: "gaavnfresh-sales.firebasestorage.app",
  messagingSenderId: "974451495449",
  appId: "1:974451495449:web:3985b05c49e52b5fbad088"
};

let db=null, PLAN=null, LOG=[];
const $=id=>document.getElementById(id);
function log(s){ LOG.push(s); $('log').textContent=LOG.join('\n'); $('log').scrollTop=1e9; }

// Firestore will not work from a file:// page — say so plainly rather than
// letting it fail with an opaque network error.
if(location.protocol==='file:'){
  const w=$('origin-warn'); w.style.display='';
  w.innerHTML='<b>⚠ This page is open from a file on your computer (file://).</b><br>'
    +'Firestore cannot be reached from a local file — the browser blocks it. '
    +'Upload this file to your GitHub repo and open it from the <b>github.io</b> address instead, '
    +'then everything below will work.';
}

/* ── pure transforms (unit-tested separately) ─────────────────────── */
function nameKey(s){ return String(s||'').replace(/\s+/g,' ').trim().toLowerCase(); }
function dayStr(x){
  x=String(x||'').trim();
  if(x.indexOf('T')>0){ const d=new Date(x); if(!isNaN(d))
    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
  const m=x.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if(m) return m[3]+'-'+String(m[2]).padStart(2,'0')+'-'+String(m[1]).padStart(2,'0');
  return x.slice(0,10);
}
function num(v){ const n=parseFloat(v); return isNaN(n)?0:n; }

// Group the Sheet's product-line rows into one order each.
// Highest-wins on total and paid — the same rule the Apps Script uses, so a
// superseded leftover row cannot inflate the figure.
function groupOrders(rows){
  const by={};
  rows.forEach(r=>{
    const id=String(r['Order ID']||'').trim();
    if(!id||id==='undefined'||id.indexOf('TOTAL:')===0||id.indexOf('RESUBMIT:')===0) return;
    if(!by[id]) by[id]={id:id, date:dayStr(r._date||r['Date']),
      custName:String(r['Customer']||'').replace(/\s+/g,' ').trim(),
      category:String(r['Category']||''), area:String(r['Area']||''),
      status:String(r['Status']||''), total:0, paid:0, paymentMode:'',
      items:[], notes:String(r['Notes']||''), createdBy:String(r['Created By']||''),
      totalsSeen:[]};
    const o=by[id];
    const t=num(r['Order Total (Rs)']); if(t){ o.totalsSeen.push(t); if(t>o.total) o.total=t; }
    const p=num(r['Payment Amt']);      if(p>o.paid) o.paid=p;
    if(String(r['Payment Mode']||'').trim()) o.paymentMode=String(r['Payment Mode']).trim();
    const prod=String(r['Product']||'').trim();
    if(prod && prod!=='(no items)')
      o.items.push({product:prod, qty:num(r['Qty']), unit:String(r['Unit']||''),
                    rate:num(r['Rate (Rs)']), amount:num(r['Amount (Rs)'])});
  });
  return Object.values(by);
}

// Resolve each order's customer NAME to a customer ID. Anything that cannot be
// resolved is REPORTED, never silently dropped or invented.
function linkCustomers(orders, customers){
  const byName={};
  customers.forEach(c=>{ const k=nameKey(c.name); if(k && !byName[k]) byName[k]=c.id; });
  const unmatched={};
  orders.forEach(o=>{
    const k=nameKey(o.custName);
    o.customerId = byName[k] || null;
    if(!o.customerId) unmatched[o.custName]=(unmatched[o.custName]||0)+1;
  });
  return unmatched;
}

function analyse(customers, orders, payments, deletedIds){
  const unmatched=linkCustomers(orders, customers);
  const del=new Set(deletedIds.map(String));
  let phantom=0, conflict=0, mismatch=0;
  orders.forEach(o=>{
    o.deleted = del.has(String(o.id));
    if(o.deleted) phantom++;
    if([...new Set(o.totalsSeen)].length>1) conflict++;
    const lineSum=o.items.reduce((s,i)=>s+i.amount,0);
    if(lineSum>0 && o.total>0 && Math.abs(lineSum-o.total)>1) mismatch++;
  });
  const live=orders.filter(o=>!o.deleted);
  return {customers, orders, payments,
    unmatched, phantom, conflict, mismatch,
    sheetSales: live.reduce((s,o)=>s+o.total,0),
    sheetPaid : live.reduce((s,o)=>s+o.paid,0),
    payTotal  : payments.reduce((s,p)=>s+num(p['Amount']||p['Amount (Rs)']),0)};
}

/* ── reading the Sheet ────────────────────────────────────────────── */
function baseUrl(){ return String($('sheet-url').value||'').trim().split('#')[0].split('?')[0].replace(/\/+$/,''); }
function keyQ(){ const k=String($('sheet-key').value||'').trim(); return k?'&key='+encodeURIComponent(k):''; }
async function api(action, extra){
  const u=baseUrl()+'?action='+action+(extra||'')+keyQ()+'&_t='+Date.now();
  const r=await fetch(u,{cache:'no-store'});
  const j=await r.json();
  if(j && j.error) throw new Error(action+': '+j.error);
  return j;
}
function monthsBetween(a,b){
  const out=[]; let d=new Date(a+'-01T00:00:00'); const e=new Date(b+'-01T00:00:00');
  while(d<=e){ out.push(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')); d.setMonth(d.getMonth()+1); }
  return out;
}

/* ── STEP 0 — wipe Firestore (never touches the Google Sheet) ─────── */
// Deliberately awkward: Firestore has no "delete collection" call, and a
// mis-fired wipe is unrecoverable, so this demands a typed confirmation and
// reports the count before and after.
const WIPE_COLLECTIONS=['customers','orders','payments'];
async function stepWipe(){
  try{ await _stepWipeInner(); }catch(e){ log('\n✗ ERASE FAILED: '+e.message
    +(/permission/i.test(e.message)?'\n  → your Firestore Rules have expired. Publish the new rules first.':'')); }
}
async function _stepWipeInner(){
  const d=initDb();
  log('\n── counting what is currently in Firestore ──');
  let total=0; const found={};
  for(const c of WIPE_COLLECTIONS){
    const snap=await d.collection(c).get();
    found[c]=snap.size; total+=snap.size;
    log('  '+c.padEnd(12)+snap.size+' document(s)');
  }
  if(!total){ log('\n  Nothing to erase — Firestore is already empty.'); return; }
  const typed=prompt('This permanently deletes '+total+' document(s) from Firestore.\n\n'
    +'Your Google Sheet is NOT touched — it stays exactly as it is.\n\n'
    +'Type  ERASE  to confirm:');
  if(String(typed||'').trim().toUpperCase()!=='ERASE'){ log('\n  Cancelled — nothing was deleted.'); return; }
  log('\n── erasing ──');
  for(const c of WIPE_COLLECTIONS){
    let removed=0;
    while(true){
      const snap=await d.collection(c).limit(400).get();
      if(snap.empty) break;
      const batch=d.batch();
      snap.forEach(doc=>batch.delete(doc.ref));
      await batch.commit();
      removed+=snap.size; log('    '+c+': '+removed+'/'+found[c]);
    }
  }
  log('\n── confirming it is empty ──');
  let left=0;
  for(const c of WIPE_COLLECTIONS){
    const snap=await d.collection(c).get(); left+=snap.size;
    log('  '+c.padEnd(12)+snap.size+' document(s) remaining');
  }
  log(left? '\n✗ '+left+' document(s) survived — run step 0 again.'
          : '\n✔ Firestore is empty. Your Google Sheet is untouched.');
}

/* ── STEP 1 ───────────────────────────────────────────────────────── */
async function stepAnalyse(){
  LOG=[]; $('btn2').disabled=true; $('btn3').disabled=true; $('preview-panel').style.display='none';
  try{
    if(!String($('sheet-key').value||'').trim()){
      log('Enter the access code first — the same one your phones use.');
      log('It is deliberately not saved in this file, because this file sits on a public GitHub page.');
      return;
    }
    log('Reading the Sheet. Nothing is written in this step.\n');
    const jc=await api('getCustomers');
    const customers=jc.customers||[];
    log('  customers ......... '+customers.length);

    const months=monthsBetween($('m-from').value, $('m-to').value);
    let rows=[], payments=[];
    for(const m of months){
      const jo=await api('getMonthOrders','&month='+m);
      const n=(jo.orders||[]).length; rows=rows.concat(jo.orders||[]);
      const jp=await api('getMonthPayments','&month='+m);
      const np=(jp.payments||[]).length; payments=payments.concat(jp.payments||[]);
      log('  '+m+' ........... '+n+' order rows, '+np+' payment rows');
    }
    let deletedIds=[];
    try{ const jd=await api('getDeletedOrders'); deletedIds=(jd.deleted||[]).map(d=>d.id); }catch(e){}
    log('  deleted-order tombstones ... '+deletedIds.length);

    const orders=groupOrders(rows);
    log('\n  '+rows.length+' product-line rows collapse into '+orders.length+' orders.');

    PLAN=analyse(customers, orders, payments, deletedIds);
    const U=Object.keys(PLAN.unmatched);

    log('\n── what the Sheet contains ──');
    log('  orders to write ......... '+orders.filter(o=>!o.deleted).length+'  (+'+PLAN.phantom+' marked deleted)');
    log('  payments to write ....... '+payments.length);
    log('  customers to write ...... '+customers.length);
    log('  sales value ............. Rs '+Math.round(PLAN.sheetSales).toLocaleString('en-IN'));
    log('  collected on orders ..... Rs '+Math.round(PLAN.sheetPaid).toLocaleString('en-IN'));
    log('  payment ledger total .... Rs '+Math.round(PLAN.payTotal).toLocaleString('en-IN'));

    log('\n── faults found in the existing data ──');
    log('  orders deleted on a phone but still in the Sheet .. '+PLAN.phantom);
    log('  orders carrying two different totals .............. '+PLAN.conflict);
    log('  order total disagrees with its product lines ...... '+PLAN.mismatch);
    log('  order customer names with no matching customer .... '+U.length);

    if(U.length){
      log('\n  ⚠ THESE ORDERS HAVE NO CUSTOMER RECORD. They will be written with');
      log('    customerId = null and listed under "Unlinked" so nothing is lost:');
      U.slice(0,25).forEach(n=>log('      "'+n+'"  ('+PLAN.unmatched[n]+' order(s))'));
      if(U.length>25) log('      …and '+(U.length-25)+' more');
    }
    renderPreview(PLAN);
    log('\n✔ Analysis complete. Nothing has been written.');
    log('  Send me this report before pressing step 2.');
    $('btn2').disabled=false;
  }catch(e){ log('\n✗ FAILED: '+e.message); }
}

function renderPreview(P){
  const live=P.orders.filter(o=>!o.deleted);
  const sample=live.slice(0,8);
  let h='<div class="muted">First few orders exactly as they will be stored — one document per order, '
    +'linked by <b>customerId</b>, with the product lines inside it:</div>'
    +'<table><tr><th>doc id</th><th>date</th><th>customerId</th><th>customer (resolved)</th>'
    +'<th class="n">total</th><th class="n">paid</th><th>items</th></tr>';
  sample.forEach(o=>{
    h+='<tr><td>'+o.id+'</td><td>'+o.date+'</td>'
      +'<td'+(o.customerId?'':' style="color:var(--red);"')+'>'+(o.customerId||'— unlinked —')+'</td>'
      +'<td>'+o.custName+'</td>'
      +'<td class="n">'+Math.round(o.total).toLocaleString('en-IN')+'</td>'
      +'<td class="n">'+Math.round(o.paid).toLocaleString('en-IN')+'</td>'
      +'<td>'+o.items.map(i=>i.product+' '+i.qty+i.unit).join(', ')+'</td></tr>';
  });
  h+='</table>';
  $('preview').innerHTML=h; $('preview-panel').style.display='';
}

/* ── STEP 2 ───────────────────────────────────────────────────────── */
function initDb(){
  if(db) return db;
  firebase.initializeApp(firebaseConfig);
  db=firebase.firestore();
  return db;
}
async function commitAll(coll, docs, idOf, bodyOf){
  const d=initDb(); let done=0;
  for(let i=0;i<docs.length;i+=400){
    const slice=docs.slice(i,i+400);
    const batch=d.batch();
    slice.forEach(x=>batch.set(d.collection(coll).doc(String(idOf(x))), bodyOf(x), {merge:true}));
    await batch.commit();
    done+=slice.length;
    log('    '+coll+': '+done+'/'+docs.length);
  }
  return done;
}
async function stepMigrate(){
  if(!PLAN){ log('Run step 1 first.'); return; }
  if(!confirm('Write '+PLAN.customers.length+' customers, '+PLAN.orders.length+' orders and '
    +PLAN.payments.length+' payments into Firestore?\n\nYour Google Sheet is NOT touched or changed.')) return;
  $('btn2').disabled=true;
  try{
    const now=new Date().toISOString();
    log('\n── writing to Firestore ──');

    await commitAll('customers', PLAN.customers, c=>c.id, c=>({
      name:String(c.name||''), category:String(c.category||''), area:String(c.area||''),
      phone:String(c.phone||''), pricing:c.pricing||{},
      balance:num(c.balance), balanceAsOf:c.balanceAsOf?dayStr(c.balanceAsOf):null,
      source:'sheet-migration', migratedAt:now
    }));

    await commitAll('orders', PLAN.orders, o=>o.id, o=>({
      customerId:o.customerId, customerNameAtImport:o.custName,
      date:o.date, status:o.status||'confirmed',
      total:o.total, paidAmount:o.paid, paymentMode:o.paymentMode||'',
      items:o.items, notes:o.notes||'', createdBy:o.createdBy||'',
      category:o.category||'', area:o.area||'',
      deleted:!!o.deleted, source:'sheet-migration', migratedAt:now
    }));

    await commitAll('payments', PLAN.payments, (p,i)=>String(p['Payment ID']||p['payId']||('PAY-'+dayStr(p['Date'])+'-'+Math.abs(hash(JSON.stringify(p))))), p=>({
      customerId:custIdFor(p), customerNameAtImport:String(p['Customer']||''),
      date:dayStr(p['Date']), amount:num(p['Amount']||p['Amount (Rs)']),
      mode:String(p['Mode']||p['Payment Mode']||''), notes:String(p['Notes']||''),
      createdBy:String(p['Created By']||''), deleted:false,
      source:'sheet-migration', migratedAt:now
    }));

    log('\n✔ Written. Your Google Sheet is untouched.');
    log('  Press step 3 to check Firestore agrees with the Sheet.');
    $('btn3').disabled=false;
  }catch(e){ log('\n✗ WRITE FAILED: '+e.message); $('btn2').disabled=false; }
}
function hash(s){ let h=0; for(let i=0;i<s.length;i++){ h=((h<<5)-h)+s.charCodeAt(i); h|=0; } return h; }
function custIdFor(p){
  const k=nameKey(p['Customer']);
  const c=(PLAN.customers||[]).find(x=>nameKey(x.name)===k);
  return c?c.id:null;
}

/* ── STEP 3 ───────────────────────────────────────────────────────── */
async function stepVerify(){
  try{
    const d=initDb();
    log('\n── reading back from Firestore ──');
    const [cs,os,ps]=await Promise.all([
      d.collection('customers').get(), d.collection('orders').get(), d.collection('payments').get()]);
    let sales=0, paid=0, live=0, del=0;
    os.forEach(doc=>{ const o=doc.data(); if(o.deleted){del++;return;} live++; sales+=num(o.total); paid+=num(o.paidAmount); });
    let pTot=0; ps.forEach(doc=>pTot+=num(doc.data().amount));

    const rows=[
      ['customers', PLAN.customers.length, cs.size],
      ['orders (live)', PLAN.orders.filter(o=>!o.deleted).length, live],
      ['orders (deleted)', PLAN.phantom, del],
      ['payments', PLAN.payments.length, ps.size],
      ['sales value', Math.round(PLAN.sheetSales), Math.round(sales)],
      ['collected on orders', Math.round(PLAN.sheetPaid), Math.round(paid)],
      ['payment ledger', Math.round(PLAN.payTotal), Math.round(pTot)],
    ];
    log('\n  ' + 'item'.padEnd(22) + 'Sheet'.padStart(12) + 'Firestore'.padStart(14) + '   ');
    let bad=0;
    rows.forEach(([k,a,b])=>{
      const ok = a===b;
      if(!ok) bad++;
      log('  ' + k.padEnd(22) + String(a).padStart(12) + String(b).padStart(14) + '   ' + (ok?'match':'✗ DIFFERS'));
    });
    log(bad ? ('\n✗ '+bad+' figure(s) differ — do NOT switch the app over. Send me this report.')
            : '\n✔ Every figure matches. The data is safely in Firestore.');
  }catch(e){ log('\n✗ VERIFY FAILED: '+e.message); }
}

function dlReport(){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([LOG.join('\n')],{type:'text/plain'}));
  a.download='gaavnfresh_migration_report.txt'; a.click();
}
</script>
</body>
</html>
